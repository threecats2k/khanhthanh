<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 80" width="350" height="80">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3182ce;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#63b3ed;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="40" cy="40" r="32" fill="#3182ce" opacity="0.1"/>
  
  <!-- Sewing machine/spool icon -->
  <g transform="translate(40, 40)">
    <!-- Thread spool -->
    <ellipse cx="0" cy="-8" rx="8" ry="4" fill="none" stroke="#3182ce" stroke-width="2"/>
    <ellipse cx="0" cy="-8" rx="6" ry="3" fill="#63b3ed" opacity="0.3"/>
    <!-- Thread coming from spool -->
    <line x1="0" y1="-4" x2="0" y2="8" stroke="#3182ce" stroke-width="2" stroke-linecap="round"/>
    <!-- Needle -->
    <line x1="0" y1="8" x2="0" y2="18" stroke="#3182ce" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="10" r="1.5" fill="#3182ce"/>
    <!-- Fabric lines -->
    <line x1="-12" y1="18" x2="12" y2="18" stroke="#bee3f8" stroke-width="1.5" stroke-dasharray="2 2"/>
    <line x1="-10" y1="22" x2="10" y2="22" stroke="#bee3f8" stroke-width="1.5" stroke-dasharray="2 2"/>
  </g>
  
  <!-- Company Name -->
  <text x="90" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a365d">Khanh Thanh</text>
  <text x="90" y="52" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="url(#blueGradient)">Uniform</text>
  
  <!-- Tagline -->
  <text x="90" y="68" font-family="Arial, sans-serif" font-size="10" fill="#4a5568" font-style="italic">Quality - Professional - Reliable</text>
</svg>
