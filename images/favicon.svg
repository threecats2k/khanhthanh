<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="faviconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3182ce;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#63b3ed;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#faviconGradient)" opacity="0.2"/>
  <circle cx="50" cy="50" r="40" fill="none" stroke="#3182ce" stroke-width="2"/>
  
  <!-- Sewing needle and thread icon -->
  <g transform="translate(50, 50)">
    <!-- Thread spool -->
    <ellipse cx="0" cy="-15" rx="10" ry="5" fill="none" stroke="#3182ce" stroke-width="2.5"/>
    <ellipse cx="0" cy="-15" rx="7" ry="3.5" fill="#63b3ed" opacity="0.4"/>
    <!-- Thread -->
    <line x1="0" y1="-10" x2="0" y2="5" stroke="#3182ce" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Needle -->
    <line x1="0" y1="5" x2="0" y2="20" stroke="#3182ce" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="8" r="2" fill="#3182ce"/>
    <!-- Fabric -->
    <line x1="-15" y1="20" x2="15" y2="20" stroke="#bee3f8" stroke-width="2" stroke-dasharray="3 2"/>
  </g>
  
  <!-- KT Initials -->
  <text x="50" y="75" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#3182ce" text-anchor="middle">KT</text>
</svg>
